<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded White Border -->
  <rect x="2" y="2" width="236" height="356" rx="18" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Inner Card Face -->
  <rect x="10" y="10" width="220" height="340" rx="13" ry="13" fill="#18181b"/>

  <!-- Center Oval (if non-wild) -->
  

  <!-- Center Artwork -->
  
        <g transform="rotate(-23 120 180)">
          <!-- 4-Quadrant Wild Oval -->
          <path d="M 120 180 L 120 110 A 70 110 0 0 0 50 180 Z" fill="#e52521"/>
          <path d="M 120 180 L 190 180 A 70 110 0 0 0 120 110 Z" fill="#0085ca"/>
          <path d="M 120 180 L 50 180 A 70 110 0 0 0 120 250 Z" fill="#f6c400"/>
          <path d="M 120 180 L 120 250 A 70 110 0 0 0 190 180 Z" fill="#00a651"/>
          <ellipse cx="120" cy="180" rx="70" ry="110" fill="none" stroke="#ffffff" stroke-width="6"/>
        </g>
        

  <!-- Corner Symbols -->
  
        <g transform="translate(24, 34) scale(0.45)">
          <path d="M -15 0 A 15 15 0 0 1 0 -15 L 0 0 Z" fill="#e52521"/>
          <path d="M 0 -15 A 15 15 0 0 1 15 0 L 0 0 Z" fill="#0085ca"/>
          <path d="M -15 0 A 15 15 0 0 0 0 15 L 0 0 Z" fill="#f6c400"/>
          <path d="M 0 15 A 15 15 0 0 0 15 0 L 0 0 Z" fill="#00a651"/>
          <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="2.5"/>
        </g>
        
  
    <g transform="rotate(180 120 180)">
      
        <g transform="translate(24, 34) scale(0.45)">
          <path d="M -15 0 A 15 15 0 0 1 0 -15 L 0 0 Z" fill="#e52521"/>
          <path d="M 0 -15 A 15 15 0 0 1 15 0 L 0 0 Z" fill="#0085ca"/>
          <path d="M -15 0 A 15 15 0 0 0 0 15 L 0 0 Z" fill="#f6c400"/>
          <path d="M 0 15 A 15 15 0 0 0 15 0 L 0 0 Z" fill="#00a651"/>
          <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="2.5"/>
        </g>
        
    </g>
    
</svg>