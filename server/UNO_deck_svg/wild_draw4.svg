<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded White Border -->
  <rect x="2" y="2" width="236" height="356" rx="18" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Inner Card Face -->
  <rect x="10" y="10" width="220" height="340" rx="13" ry="13" fill="#18181b"/>

  <!-- Center Oval (if non-wild) -->
  <ellipse cx="120" cy="180" rx="72" ry="112" transform="rotate(-23 120 180)" fill="#ffffff" filter="url(#drop-shadow)"/>

  <!-- Center Artwork -->
  
        <g transform="rotate(-23 120 180)">
          <!-- 4 overlapping mini cards: Red, Blue, Yellow, Green -->
          <rect x="75" y="130" width="36" height="54" rx="4" ry="4" fill="#e52521" stroke="#ffffff" stroke-width="2.5" transform="rotate(-20 93 157)"/>
          <rect x="105" y="125" width="36" height="54" rx="4" ry="4" fill="#0085ca" stroke="#ffffff" stroke-width="2.5" transform="rotate(-5 123 152)"/>
          <rect x="90" y="155" width="36" height="54" rx="4" ry="4" fill="#f6c400" stroke="#ffffff" stroke-width="2.5" transform="rotate(10 108 182)"/>
          <rect x="120" y="150" width="36" height="54" rx="4" ry="4" fill="#00a651" stroke="#ffffff" stroke-width="2.5" transform="rotate(25 138 177)"/>
          <text x="120" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="#ffffff" stroke="#000000" stroke-width="3" text-anchor="middle" paint-order="stroke fill">+4</text>
        </g>
        

  <!-- Corner Symbols -->
  
        <text x="24" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#ffffff" stroke="#000" stroke-width="1.5" text-anchor="middle" paint-order="stroke fill">+4</text>
        
  
    <g transform="rotate(180 120 180)">
      
        <text x="24" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#ffffff" stroke="#000" stroke-width="1.5" text-anchor="middle" paint-order="stroke fill">+4</text>
        
    </g>
    
</svg>