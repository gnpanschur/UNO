<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded White Border -->
  <rect x="2" y="2" width="236" height="356" rx="18" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Inner Card Face -->
  <rect x="10" y="10" width="220" height="340" rx="13" ry="13" fill="#e52521"/>

  <!-- Center Oval (if non-wild) -->
  <ellipse cx="120" cy="180" rx="72" ry="112" transform="rotate(-23 120 180)" fill="#ffffff" filter="url(#drop-shadow)"/>

  <!-- Center Artwork -->
  
        <g transform="rotate(-23 120 180)">
          <circle cx="120" cy="180" r="42" fill="none" stroke="#e52521" stroke-width="16"/>
          <line x1="88" y1="212" x2="152" y2="148" stroke="#e52521" stroke-width="16"/>
        </g>
        

  <!-- Corner Symbols -->
  
        <g transform="translate(24, 34)">
          <circle cx="0" cy="0" r="11" fill="none" stroke="#ffffff" stroke-width="3.5"/>
          <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ffffff" stroke-width="3.5"/>
        </g>
        
  
    <g transform="rotate(180 120 180)">
      
        <g transform="translate(24, 34)">
          <circle cx="0" cy="0" r="11" fill="none" stroke="#ffffff" stroke-width="3.5"/>
          <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ffffff" stroke-width="3.5"/>
        </g>
        
    </g>
    
</svg>